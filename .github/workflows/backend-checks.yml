name: Backend checks

on:
  push:
    branches: [main, 'chore/**', 'feat/**', 'fix/**']
    paths:
      - 'backend/**'
      - '.github/workflows/backend-checks.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-checks.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: intema_test
          POSTGRES_USER: intema_test
          POSTGRES_PASSWORD: intema_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U intema_test -d intema_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://intema_test:intema_test@localhost:5432/intema_test
      TEST_DATABASE_URL: postgresql+psycopg://intema_test:intema_test@localhost:5432/intema_test
      JWT_SECRET_KEY: ci-only-secret-key-not-for-production-change-me
      ADMIN_PASSWORD: Cambiar123!
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e '.[dev]'
      - name: Run backend tests
        run: pytest